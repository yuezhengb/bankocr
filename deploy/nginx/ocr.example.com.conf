# Example HTTPS front door for a self-hosted BankOCR process.
# Copy to /etc/nginx/conf.d/ocr.example.com.conf and replace the hostname.
server {
    listen 80;
    listen [::]:80;
    server_name ocr.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ocr.example.com;

    ssl_certificate     /etc/letsencrypt/live/ocr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ocr.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:BankOCRSSL:10m;
    ssl_session_timeout 10m;

    auth_basic           "BankOCR";
    auth_basic_user_file /etc/nginx/.htpasswd-bankocr;

    client_max_body_size 100m;
    client_body_timeout 120s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
    }
}
