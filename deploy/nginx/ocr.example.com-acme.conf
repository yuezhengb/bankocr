# Temporary HTTP-only site used while a certificate authority verifies the domain.
# Copy to /etc/nginx/conf.d/ocr.example.com-acme.conf and replace the hostname.
server {
    listen 80;
    listen [::]:80;
    server_name ocr.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
